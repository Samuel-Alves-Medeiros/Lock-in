<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
    <body >
    <main>
        <div class="cards">
              <div class="container">
                <h2>Crie sua conta</h2>
                <p>Bem vindo ao Lock in space</p>
                <div class="email-div label-div">
                    <p class="errormessage" id="erro-message"></p>
                    <label for="user-email">E-mail</label>
                    <input type="email" name="email" id="user-email" class=" input user-email" placeholder="sample@gmail.com">
                </div>
                <div class="name-div label-div">
                    <label for="user-name">Nome</label>
                    <input type="text" name="user-name" id="user-name" class="input user-name">
                </div>
                <div class="password-div label-div">
                    <label for="user-password">Senha</label>
                    <input type="password" name="user-password" id="user-password" class="input user-password">

                </div>
                <div class="password-confirm-div label-div">
                    <label for="password-confirm">Confirme a senha</label>
                    <input type="password" name="user-password" id="password-confirm" class="input password-confirm">
                </div>
                <div class="login-section">
                    <p>Já possui uma conta?</p>
                    <a href="./login.html">login</a>
                </div>
                <div class="label-div">
                    <input type="button" value="sign-up" class="btn" id="btn">
                </div>
            </div>
            <div class="site-img">
                <img src="../images/lock_in_space_boy_illustration.png" alt="">
                
            </div>
        </div>
    </main>
    <script src="../src/signup.js"></script>
</body>
</html>
