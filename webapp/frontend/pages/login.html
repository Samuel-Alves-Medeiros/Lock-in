<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
    <body >
    <main>
        <div class="cards">
              <div class="container">
                <h2>Login</h2>
                <p>Bem vindo ao Lock in space</p>
                <div class="email-div label-div">
                    <p class="errormessage" id="erro-message"></p>
                    <label for="user-email">E-mail</label>
                    <input type="email" name="email" id="user-email" class=" input user-email" placeholder="sample@gmail.com">
                </div>
                <div class="password-div label-div">
                    <label for="user-password">Senha</label>
                    <input type="password" name="user-password" id="user-password" class="input user-password">
                </div>
                <div class="login-section">
                    <p>Ainda não tem uma conta?</p>
                    <a href="./index.html">cadastrar-se</a>
                </div>
                <div class="label-div">
                    <input type="button" value="login" class="btn" id="btn">
                </div>
            </div>
            <div class="site-img">
                <img src="../images/lock_in_space_login_illustration.png" alt="">
                
            </div>
        </div>
    </main>
    <script src="../src/login.js"></script>
</body>
</html>
